spring:
  application:
    name: ingredient-scan-tests
  mandatory-file-encoding: UTF-8
  main:
#    banner-mode: off
#    web-application-type: none
  webflux:
    multipart:
      max-in-memory-size: 256KB
      max-disk-usage-per-part: 1GB
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL
  docker:
    compose:
      enabled: false
      lifecycle-management: none
  cloud:
    aws:
      credentials:
        access-key: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:minioadmin}
        secret-key: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:minioadminpassword}
      region:
        static: ${SPRING_CLOUD_AWS_REGION_STATIC:us-east-1}
      endpoint: ${SPRING_CLOUD_AWS_ENDPOINT:http://minio:9000}
      s3:
        endpoint: ${SPRING_CLOUD_AWS_ENDPOINT:http://minio:9000}
        path-style-access-enabled: true
        bucket:
          name: ${SPRING_CLOUD_AWS_S3_BUCKET_NAME:photos}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:ingredient-scanner-test-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

logging:
  level:
    root: DEBUG
    net.otuskotlin: DEBUG
    org.springframework.boot.docker.compose: DEBUG
    org.springframework.boot.docker.compose.service.connection: DEBUG

    org.apache.kafka: WARN
    org.apache.kafka.common.config.AbstractConfig: ERROR
    org.apache.kafka.clients: WARN

    org.springframework: INFO

    org.testcontainers: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
