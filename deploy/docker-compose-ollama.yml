# Минимальная версия инфраструктуры на базе
# OpenSearch - хранилище логов и метрик
# OpenSearch Dashboards - отрисовка логов
# Fluent Bit - служба сбора логов
# Envoy - прокси
# Keycloak - сервер идентификации
# Ollama - модель Llama для обработки изображений

# Адреса:
# Приложение доступно по http://localhost:8080 (envoy прокси)
# Панели мониторинга http://localhost:5601 (opensearch dashboards, kibana)
# Управление пользователями http://localhost:8180/admin (keycloak)
# Ollama API http://localhost:11434 (для отладки)
services:
  ingredient-scan-app:
    # ОБРАЗ ИЗ JIB
    image: darthchain/ingredient-scan-scan:latest
    container_name: ingredient-scan-app
    pull_policy: always # Всегда проверять обновление образа
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=ingredient-scan
      - KEYCLOAK_CLIENT_ID=ingredient-scan-service
      - DATABASE_URL=jdbc:postgresql://postgres:5432/ingredient_scan
      - SPRING_DATASOURCE_USERNAME=ingredient_user
      - SPRING_DATASOURCE_PASSWORD=ingredient_pass
      - OLLAMA_URL=http://ollama:11434 # Ссылка на Ollama внутри сети Docker
    ports:
      - "8081:8080" # !!! Прямой доступ к приложению (для отладки, в обход Envoy)
    depends_on:
      # ИЗМЕНЕНИЕ: Ждем, пока Keycloak будет HEALTHY
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_started
      opensearch:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      # Alpine не имеет curl, используем wget. Путь к Actuator health.
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17.7
    container_name: postgres
    environment:
      - POSTGRES_DB=ingredient_scan
      - POSTGRES_USER=ingredient_user
      - POSTGRES_PASSWORD=ingredient_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingredient_user -d ingredient_scan"]
      interval: 10s
      timeout: 5s
      retries: 5

  fluent-bit:
    container_name: fluent-bit
    image: fluent/fluent-bit
    ports:
      - "24224:24224"
      - "24224:24224/udp"
      - "2020:2020"
    environment:
      - opensearch_host=opensearch
      - opensearch_user=admin
      - opensearch_pass=adm-Password0
    volumes:
      - ./volumes/fluent-bit-etc/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./volumes/fluent-bit-etc/parsers.conf:/fluent-bit/etc/parsers.conf
    depends_on:
      - opensearch

  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
      - http.port=9200
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=adm-Password0
    ports:
      - '9200:9200'
      - '9600:9600'
    healthcheck:
      test: ["CMD-SHELL", "curl -ku admin:adm-Password0 https://localhost:9200/_cluster/health?pretty | grep status | grep -q '\\(green\\|yellow\\)'"]
      interval: 10s
      timeout: 10s
      retries: 10
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: 'admin'
      OPENSEARCH_PASSWORD: 'adm-Password0'
    depends_on:
      opensearch:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.29.0
    container_name: envoy
    volumes:
      - ./volumes/envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - ./volumes/envoy/certs:/etc/envoy/certs
    ports:
      - "8080:8080"
    depends_on:
      ingredient-scan-app:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    # ИЗМЕНЕНИЕ: Упрощенная команда без shell-скриптов
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --http-enabled=true
    environment:
      # ИЗМЕНЕНИЕ: Исправлены переменные администратора
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ingredient_scan
      KC_DB_USERNAME: ingredient_user
      KC_DB_PASSWORD: ingredient_pass
      KC_HEALTH_ENABLED: true
      # ИЗМЕНЕНИЕ: Добавлены настройки hostname
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./volumes/keycloak/import:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    # ИЗМЕНЕНИЕ: Упрощенный healthcheck (без curl)
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434" # Порт для доступа к API Ollama (для отладки)
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags && curl -f http://localhost:11434/api/show | grep -q llava:llama3.1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
#      start_period: 120s # Даем больше времени на загрузку модели
# Автоматическая загрузка модели при первом запуске
# Пока выгодней запускать руками
#    entrypoint: |
#      sh -c "
#        #!!! Запускаем Ollama в фоне
#        /bin/ollama serve &
#
#        # Ждем запуска сервера
#        until curl -f http://localhost:11434/api/tags > /dev/null 2>&1; do
#          echo 'Ждем запуска Ollama...'
#          sleep 5
#        done
#
#        # !!! Проверяем, есть ли уже модель
#        if ! curl -f http://localhost:11434/api/show | grep -q llava:llama3.1; then
#          echo 'Загружаем модель llava:llama3.1...'
#          /bin/ollama pull llava:llama3.1
#          echo 'Модель успешно загружена!'
#        else
#          echo 'Модель llava:llama3.1 уже загружена'
#        fi
#
#        # Оставляем Ollama работать в foreground
#        wait
#      "

volumes:
  opensearch-data:
  ollama_data: