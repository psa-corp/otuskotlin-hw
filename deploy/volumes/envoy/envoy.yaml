# Envoy Proxy Configuration
# Для Ingredient Scan - Production

admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15001

static_resources:
  listeners:
    - name: listener_ingredient_scan
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.data.accesslog.v3.StdoutAccessLog

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: ingredient_scan_service
                      domains: ["*"]
                      routes:

                        # ========== PUBLIC ENDPOINTS (без JWT) ==========

                        # Health check - для мониторинга
                        - match: { prefix: "/v1/actuator/health" }
                          route:
                            cluster: ingredient-scan-app
                            timeout: 10s

                        - match: { prefix: "/v1/actuator/info" }
                          route:
                            cluster: ingredient-scan-app
                            timeout: 10s

                        # Download files - публичный
                        - match: { prefix: "/v1/download/file/" }
                          route:
                            cluster: ingredient-scan-app
                            timeout: 30s

                        # ========== PROTECTED ENDPOINTS (требуют JWT) ==========

                        # Analysis regenerate - все операции (GET, POST, PUT, DELETE)
                        - match: { prefix: "/v1/analysis/" }
                          route:
                            cluster: ingredient-scan-app
                            timeout: 60s

                        # Composition - все операции (GET, POST, PUT, DELETE)
                        - match: { prefix: "/v1/composition/" }
                          route:
                            cluster: ingredient-scan-app
                            timeout: 60s

                        # ========== KEYCLOAK ENDPOINTS ==========

                        - match: { prefix: "/admin/" }
                          route:
                            cluster: keycloak
                            timeout: 30s

                        - match: { prefix: "/realms/" }
                          route:
                            cluster: keycloak
                            timeout: 30s

                        - match: { prefix: "/resources/" }
                          route:
                            cluster: keycloak
                            timeout: 30s

                        # Catch-all 404
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body:
                              inline_string: "404 Not Found"

                http_filters:

                  # ========== JWT Authentication Filter ==========
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication

                      providers:
                        keycloak_provider:
                          issuer: "http://keycloak:8080/realms/ingredient-scan"
                          remote_jwks:
                            http_uri:
                              uri: "http://keycloak:8080/realms/ingredient-scan/protocol/openid-connect/certs"
                              cluster: keycloak
                              timeout: 5s
                            cache_duration:
                              seconds: 300

                          forward: true
                          forward_payload_header: "x-jwt-payload"

                      # JWT требуется только для защищенных endpoint'ов
                      rules:

                        # PROTECTED: Analysis требует JWT
                        - match: { prefix: "/v1/analysis/" }
                          requires:
                            provider_name: "keycloak_provider"

                        # PROTECTED: Composition требует JWT
                        - match: { prefix: "/v1/composition/" }
                          requires:
                            provider_name: "keycloak_provider"

                        # PUBLIC: Эти endpoint'ы не требуют JWT
                        - match: { prefix: "/v1/actuator/" }
                          allow_missing_or_failed: true

                        - match: { prefix: "/v1/download/" }
                          allow_missing_or_failed: true

                        - match: { prefix: "/admin/" }
                          allow_missing_or_failed: true

                        - match: { prefix: "/realms/" }
                          allow_missing_or_failed: true

                  # ========== HTTP Router Filter ==========
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

    # ========== ingredient-scan-app cluster ==========
    - name: ingredient-scan-app
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      connect_timeout: 30s

      load_assignment:
        cluster_name: ingredient-scan-app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ingredient-scan-app
                      port_value: 8080

      health_checks:
        - timeout: 10s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: /v1/actuator/health

    # ========== Keycloak cluster ==========
    - name: keycloak
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      connect_timeout: 10s

      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: keycloak
                      port_value: 8080

      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 2
          healthy_threshold: 2
          http_health_check:
            path: /realms/ingredient-scan/.well-known/openid-configuration
