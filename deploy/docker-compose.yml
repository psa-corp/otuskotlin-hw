# Минимальная версия инфраструктуры на базе
# OpenSearch - хранилище логов и метрик
# OpenSearch Dashboards - отрисовка логов
# Fluent Bit - служба сбора логов
# Envoy - прокси
# Keycloak - сервер идентификации

# Адреса:
# Приложение доступно по http://localhost:8080 (envoy прокси)
# Панели мониторинга http://localhost:5601 (opensearch dashboards, kibana)
# Управление пользователями http://localhost:8180/admin (keycloak)
services:
  ingredient-scan-app:
    # ОБРАЗ ИЗ JIB
    image: darthchain/ingredient-scan-scan:latest
    container_name: ingredient-scan-app
    pull_policy: always # Всегда проверять обновление образа
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=ingredient-scan
      - KEYCLOAK_CLIENT_ID=ingredient-scan-service
      - DATABASE_URL=jdbc:postgresql://postgres:5432/ingredient_scan
      - SPRING_DATASOURCE_USERNAME=ingredient_user
      - SPRING_DATASOURCE_PASSWORD=ingredient_pass
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadminpassword
      - S3_BUCKET_NAME=scans
    ports:
      - "8081:8080" # !!! Прямой доступ к приложению (для отладки, в обход Envoy)
    depends_on:
      minio:
        condition: service_healthy
      # ИЗМЕНЕНИЕ: Ждем, пока Keycloak будет HEALTHY
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_started
      opensearch:
        condition: service_started
    healthcheck:
      # Alpine не имеет curl, используем wget. Путь к Actuator health.
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17.7
    container_name: postgres
    environment:
      - POSTGRES_DB=ingredient_scan
      - POSTGRES_USER=ingredient_user
      - POSTGRES_PASSWORD=ingredient_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingredient_user -d ingredient_scan"]
      interval: 10s
      timeout: 5s
      retries: 5

  fluent-bit:
    container_name: fluent-bit
    image: fluent/fluent-bit
    ports:
      - "24224:24224"
      - "24224:24224/udp"
      - "2020:2020"
    environment:
      - opensearch_host=opensearch
      - opensearch_user=admin
      - opensearch_pass=adm-Password0
    volumes:
      - ./volumes/fluent-bit-etc/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./volumes/fluent-bit-etc/parsers.conf:/fluent-bit/etc/parsers.conf
    depends_on:
      - opensearch

  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
      - http.port=9200
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=adm-Password0
    ports:
      - '9200:9200'
      - '9600:9600'
    healthcheck:
      test: ["CMD-SHELL", "curl -ku admin:adm-Password0 https://localhost:9200/_cluster/health?pretty | grep status | grep -q '\\(green\\|yellow\\)'"]
      interval: 10s
      timeout: 10s
      retries: 10
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: 'admin'
      OPENSEARCH_PASSWORD: 'adm-Password0'
    depends_on:
      opensearch:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.29.0
    container_name: envoy
    volumes:
      - ./volumes/envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - ./volumes/envoy/certs:/etc/envoy/certs
    ports:
      - "8080:8080"
    depends_on:
      ingredient-scan-app:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    # ИЗМЕНЕНИЕ: Упрощенная команда без shell-скриптов
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --http-enabled=true
    environment:
      # ИЗМЕНЕНИЕ: Исправлены переменные администратора
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ingredient_scan
      KC_DB_USERNAME: ingredient_user
      KC_DB_PASSWORD: ingredient_pass
      KC_HEALTH_ENABLED: true
      # ИЗМЕНЕНИЕ: Добавлены настройки hostname
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./volumes/keycloak/import:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    # ИЗМЕНЕНИЕ: Упрощенный healthcheck (без curl)
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: minio_server
    ports:
      - "9000:9000" # Порт API S3
      - "9001:9001" # Порт веб-консоли (UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      # Необязательно: Переменные для создания бакета при первом запуске
      MINIO_DEFAULT_BUCKETS: photos
    volumes:
      # Монтируем локальную папку './volumes/minio_data' на хосте
      - ./volumes/minio_data:/data
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  opensearch-data: