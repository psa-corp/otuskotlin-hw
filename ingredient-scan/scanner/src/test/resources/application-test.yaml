spring:
  application:
    name: ingredient-scan-scan
  docker:
    compose:
      enabled: false
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      s3:
        path-style-access-enabled: true
        bucket:
          name: test-bucket
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 5MB
  kafka:
    bootstrap-servers: localhost:9092
    streams:
      auto-startup: false
      application-id: ingredient-scan-test

app:
  upload:
    max-files: 3

server:
  servlet:
    context-path: /v1

logging:
  level:
    net.otuskotlin: DEBUG
    org.springframework.web: DEBUG
    root: INFO
    org.springframework.web.servlet.mvc.method.annotation: DEBUG
    org.springframework.test.web.servlet: DEBUG