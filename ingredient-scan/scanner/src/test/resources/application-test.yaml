spring:
  application:
    name: scanner-test

  docker:
    compose:
      enabled: false

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test-key
        secret-key: test-secret
      s3:
        endpoint: http://localhost:9090
        path-style-access-enabled: true

  # KAFKA - полностью отключаем для тестов
  kafka:
    bootstrap-servers:
    streams:
      auto-startup: false

    producer: {}
    consumer: {}

  main:
    web-application-type: none

app:
  upload:
    max-files: 3

logging:
  level:
    root: DEBUG