openapi: 3.0.4
info:
  title: "Ingredient Scan API"
  description: API для анализа состава продуктов
  version: 1.0.0
servers:
  - url: http://localhost:8080/v1
    description: Development server

tags:
  - name: analysis
    description: Анализ состава продуктов
  - name: composition
    description: Управление составами продуктов
  - name: download
    description: Скачивание файлов

paths:
  /analysis/get:
    post:
      tags: [analysis]
      summary: Получение анализа состава по ID
      operationId: analysisGet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisGetRequest' # Используем Request Wrapper
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisGetResponse' # Используем Response Wrapper
        '404':
          description: Анализ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analysis/regenerate:
    post:
      tags: [analysis]
      summary: Перегенерация анализа состава
      operationId: analysisRegenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRegenerateRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRegenerateResponse'
        '404':
          description: Анализ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен лимит перегенераций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /composition/create/manual:
    post:
      tags: [composition]
      summary: Создание состава вручную
      operationId: compositionCreateByManual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositionCreateByManualRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionCreateByManualResponse' # JSON с compositionId
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен дневной лимит
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media/composition/create/photos:
    post:
      tags: [media]
      summary: Создание состава по фото
      operationId: compositionCreateByPhotos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos, scan]
              properties:
                photos:
                  type: array
                  description: Фотографии состава
                  items:
                    type: string
                    format: binary
                    x-content-type: application/octet-stream
                scan:
                  $ref: '#/components/schemas/CompositionCreateByPhotosRequest' # Используем Request Wrapper
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionCreateByPhotosResponse' # JSON с compositionId
        '400':
          description: Неверные данные или размер файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен дневной лимит
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /composition/get:
    post:
      tags: [composition]
      summary: Получение состава по ID
      operationId: compositionGet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositionGetRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionGetResponse'
        '404':
          description: Состав не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /composition/context/get:
    post:
      tags: [composition]
      summary: Получение контекста состава по ID
      operationId: compositionContextGet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositionContextGetRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionContextGetResponse'
        '404':
          description: Контекст состава не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /download/file/{fileName}:
    get:
      tags: [download]
      summary: Скачивание файла
      operationId: downloadFile
      x-use-response-entity: true
      parameters:
        - name: fileName
          in: path
          required: true
          schema:
            type: string
          description: Имя файла
      responses:
        '200':
          description: Успешный ответ
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Файл не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # --- Base Schemas ---
    ResponseResult:
      type: string
      enum:
        - success
        - error

    RequestDebugStub:
      type: string
      description: Кейс стабовых данных
      enum:
        - SUCCESS
        - NOT_FOUND
        - BAD_ID

    Error:
      type: object
      properties:
        code:
          type: string
        group:
          type: string
        field:
          type: string
        message:
          type: string

    DebugMode:
      type: string
      enum: [prod, test, stub]

    RequestDebug:
      type: object
      description: Настройки режима работы (debug)
      properties:
        mode:
          $ref: '#/components/schemas/DebugMode'
        stub:
          $ref: '#/components/schemas/RequestDebugStub'

    IRequest:
      type: object
      description: Базовый интерфейс для всех запросов
      required: [requestType]
      properties:
        requestType:
          type: string
          description: Поле-дескриминатор для вычисления типа запроса
      discriminator:
        propertyName: requestType
        mapping:
          analysisGet: '#/components/schemas/AnalysisGetRequest'
          analysisRegenerate: '#/components/schemas/AnalysisRegenerateRequest'
          compositionCreateByManual: '#/components/schemas/CompositionCreateByManualRequest'
          compositionCreateByPhotos: '#/components/schemas/CompositionCreateByPhotosRequest'
          compositionGet: '#/components/schemas/CompositionGetRequest'
          downloadFile: '#/components/schemas/DownloadFileRequest'
          compositionContextGet: '#/components/schemas/CompositionContextGetRequest'

    IResponse:
      type: object
      description: Базовый интерфейс для всех ответов
      required: [responseType, result]
      properties:
        responseType:
          type: string
          description: Поле-дескриминатор для вычисления типа ответа
        result:
          $ref: '#/components/schemas/ResponseResult'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      discriminator:
        propertyName: responseType
        mapping:
          analysisGet: '#/components/schemas/AnalysisGetResponse'
          analysisRegenerate: '#/components/schemas/AnalysisRegenerateResponse'
          compositionCreateByManual: '#/components/schemas/CompositionCreateByManualResponse'
          compositionCreateByPhotos: '#/components/schemas/CompositionCreateByPhotosResponse'
          compositionGet: '#/components/schemas/CompositionGetResponse'
          compositionContextGet: '#/components/schemas/CompositionContextGetResponse'
          error: '#/components/schemas/ErrorResponse'

    # --- Wrapper Schemas (Requests) ---

    AnalysisGetRequest:
      allOf:
        - $ref: '#/components/schemas/IRequest'
        - type: object
          required:
            - analysisId
          properties:
            debug:
              $ref: '#/components/schemas/RequestDebug'
            analysisId:
              type: string
              description: ID анализа для получения
              example: "analysis_123"
              nullable: false

    AnalysisRegenerateRequest:
      allOf:
        - $ref: '#/components/schemas/IRequest'
        - type: object
          required:
            - analysisId
          properties:
            debug:
              $ref: '#/components/schemas/RequestDebug'
            analysisId:
              type: string
              description: ID анализа для получения
              example: "analysis_123"
              nullable: false

    CompositionCreateByManualRequest:
      allOf:
        - $ref: '#/components/schemas/IRequest'
        - type: object
          required:
            - scan
          properties:
            debug:
              $ref: '#/components/schemas/RequestDebug'
            scan:
              $ref: '#/components/schemas/ScanManualDto'
              nullable: false

    CompositionCreateByPhotosRequest:
      allOf:
        - $ref: '#/components/schemas/IRequest'
        - type: object
          properties:
            debug:
              $ref: '#/components/schemas/RequestDebug'
            scan:
              $ref: '#/components/schemas/ScanPhotosDto'
        # Фотографии передаются через multipart/form-data, DTO ScanPhotosDto передается в поле 'scan'

    CompositionGetRequest:
      allOf:
        - $ref: '#/components/schemas/IRequest'
        - type: object
          properties:
            debug:
              $ref: '#/components/schemas/RequestDebug'
            compositionId:
              type: string
              description: ID состава
              example: "composition_123"

    CompositionContextGetRequest:
      allOf:
        - $ref: '#/components/schemas/IRequest'
        - type: object
          properties:
            debug:
              $ref: '#/components/schemas/RequestDebug'
            contextId:
              type: string
              description: ID контекста
              example: "context_123"

    DownloadFileRequest:
      allOf:
        - $ref: '#/components/schemas/IRequest'
        - type: object
          properties:
            debug:
              $ref: '#/components/schemas/RequestDebug'

    # --- Wrapper Schemas (Responses) ---

    AnalysisGetResponse:
      allOf:
        - $ref: '#/components/schemas/IResponse'
        - type: object
          properties:
            analysis:
              $ref: '#/components/schemas/Analysis'

    AnalysisRegenerateResponse:
      allOf:
        - $ref: '#/components/schemas/IResponse'
        - type: object
          properties:
            analysis:
              $ref: '#/components/schemas/Analysis'

    CompositionCreateByManualResponse:
      allOf:
        - $ref: '#/components/schemas/IResponse'
        - type: object
          properties:
            contextId:
              type: string
              example: "context_123"

    CompositionCreateByPhotosResponse:
      allOf:
        - $ref: '#/components/schemas/IResponse'
        - type: object
          properties:
            contextId:
              type: string
              example: "context_123"

    CompositionGetResponse:
      allOf:
        - $ref: '#/components/schemas/IResponse'
        - type: object
          properties:
            composition:
              $ref: '#/components/schemas/Composition'

    CompositionContextGetResponse:
      allOf:
        - $ref: '#/components/schemas/IResponse'
        - type: object
          properties:
            context:
              $ref: '#/components/schemas/CompositionContext'

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/IResponse'
        - type: object
          properties:
            timestamp:
              type: string
              format: date-time
        # Ошибки уже есть в IResponse

    # --- Original DTOs ---

    Analysis:
      type: object
      properties:
        id:
          type: string
          example: "analysis_123"
        compositionId:
          type: string
          example: "composition_123"
        createDate:
          type: string
          format: date-time
        description:
          type: string
        rating:
          type: number
          format: double
          minimum: 1.0
          maximum: 5.0
        color:
          $ref: '#/components/schemas/Color'
        problematicComponent:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        safeComponent:
          type: array
          items:
            $ref: '#/components/schemas/Component'

    Composition:
      type: object
      properties:
        id:
          type: string
          example: "composition_123"
        createDate:
          type: string
          format: date-time
        text:
          type: string
          minLength: 10
          maxLength: 5000

    ScanManualDto:
      type: object
      required:
        - text
        - type
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ScanType'
        text:
          type: string
          minLength: 10
          maxLength: 5000
          description: Текст состава

    ScanPhotosDto:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ScanType'

    CompositionContext:
      type: object
      properties:
        id:
          type: string
          description: ID контекста
          example: "context_123"
        state:
          $ref: '#/components/schemas/State'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        timeStart:
          type: string
          format: date-time
          description: Время начала
        composition:
          $ref: '#/components/schemas/Composition'

    Component:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createDate:
          type: string
          format: date-time
        scientificName:
          type: string
        description:
          type: string
        sources:
          type: string
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        healthRisks:
          type: string

    ScanType:
      type: string
      enum: [MANUAL, PHOTO]
      description: "Тип сканирования"

    RiskLevel:
      type: string
      enum: [MINIMAL, LOW, MEDIUM, HIGH, CRITICAL]

    State:
      type: string
      enum: [NONE, RUNNING, FAILING, FINISHING]

    Color:
      type: string
      enum: [DARK_RED, RED, ORANGE, YELLOW, LIGHT_YELLOW, LIGHT_GREEN, GREEN, DARK_GREEN]