openapi: 3.0.4
info:
  title: "Ingredient Scan Internal API"
  description: Внутреннее API для общения между сервисами
  version: 1.0.0
servers:
  - url: http://localhost:8080/v1
    description: Development server

tags:
  - name: analysis
    description: Анализ состава продуктов
  - name: composition
    description: Управление составами продуктов

paths:
  /internal/analysis/find:
    post:
      tags: [internal]
      summary: Получение анализа состава по ID
      operationId: internalAnalysisFind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalAnalysisFindRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAnalysisFindResponse'
        '404':
          description: Анализ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'

  /internal/analysis/save:
    post:
      tags: [internal]
      summary: Получение анализа состава по ID
      operationId: internalAnalysisSave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalAnalysisSaveRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAnalysisSaveResponse'
        '500':
          description: Не удалось сохранить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'


  /internal/composition/find:
    post:
      tags: [internal]
      summary: Получение анализа состава по ID
      operationId: internalCompositionFind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalCompositionFindRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalCompositionFindResponse'
        '404':
          description: Анализ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'

  /internal/composition/save:
    post:
      tags: [internal]
      summary: Получение анализа состава по ID
      operationId: internalCompositionSave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalCompositionSaveRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalCompositionSaveResponse'
        '500':
          description: Не удалось сохранить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'

components:
  schemas:
    # --- Base Schemas ---
    InternalResponseResult:
      type: string
      enum:
        - success
        - error

    InternalError:
      type: object
      properties:
        code:
          type: string
        group:
          type: string
        field:
          type: string
        message:
          type: string

    InternalRequest:
      type: object
      description: Базовый интерфейс для всех запросов
      required: [requestType]
      properties:
        requestType:
          type: string
          description: Поле-дескриминатор для вычисления типа запроса
      discriminator:
        propertyName: requestType
        mapping:
          internalAnalysisFind: '#/components/schemas/InternalAnalysisFindRequest'
          internalAnalysisSave: '#/components/schemas/InternalAnalysisSaveRequest'
          internalCompositionFind: '#/components/schemas/InternalCompositionFindRequest'
          internalCompositionSave: '#/components/schemas/InternalCompositionSaveRequest'

    InternalResponse:
      type: object
      description: Базовый интерфейс для всех ответов
      required: [responseType, result]
      properties:
        responseType:
          type: string
          description: Поле-дескриминатор для вычисления типа ответа
        result:
          $ref: '#/components/schemas/InternalResponseResult'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InternalError'
      discriminator:
        propertyName: responseType
        mapping:
          internalAnalysisFind: '#/components/schemas/InternalAnalysisFindResponse'
          internalAnalysisSave: '#/components/schemas/InternalAnalysisSaveResponse'
          internalCompositionFind: '#/components/schemas/InternalCompositionFindResponse'
          internalCompositionSave: '#/components/schemas/InternalCompositionSaveResponse'
          error: '#/components/schemas/InternalErrorResponse'

    # --- Wrapper Schemas (Requests) ---

    InternalAnalysisFindRequest:
      allOf:
        - $ref: '#/components/schemas/InternalRequest'
        - type: object
          required:
            - compositionId
          properties:
            compositionId:
              type: string
              description: ID состава для получения
              example: "composition-123"
              nullable: false

    InternalAnalysisSaveRequest:
      allOf:
        - $ref: '#/components/schemas/InternalRequest'
        - type: object
          required:
            - analysis
          properties:
            analysis:
              $ref: '#/components/schemas/InternalAnalysis'

    InternalCompositionFindRequest:
      allOf:
        - $ref: '#/components/schemas/InternalRequest'
        - type: object
          required:
            - text
          properties:
            text:
              type: string
              description: Текст состава для получения
              example: "Соль, сахар"
              nullable: false

    InternalCompositionSaveRequest:
      allOf:
        - $ref: '#/components/schemas/InternalRequest'
        - type: object
          required:
            - composition
          properties:
            composition:
              $ref: '#/components/schemas/InternalComposition'


    # --- Wrapper Schemas (Responses) ---

    InternalAnalysisFindResponse:
      allOf:
        - $ref: '#/components/schemas/InternalResponse'
        - type: object
          properties:
            analysis:
              $ref: '#/components/schemas/InternalAnalysis'

    InternalAnalysisSaveResponse:
      allOf:
        - $ref: '#/components/schemas/InternalResponse'
        - type: object
          properties:
            analysis:
              $ref: '#/components/schemas/InternalAnalysis'

    InternalCompositionFindResponse:
      allOf:
        - $ref: '#/components/schemas/InternalResponse'
        - type: object
          properties:
            composition:
              $ref: '#/components/schemas/InternalComposition'

    InternalCompositionSaveResponse:
      allOf:
        - $ref: '#/components/schemas/InternalResponse'
        - type: object
          properties:
            composition:
              $ref: '#/components/schemas/InternalComposition'

    InternalErrorResponse:
      allOf:
        - $ref: '#/components/schemas/InternalResponse'
        - type: object
          properties:
            timestamp:
              type: string
              format: date-time

    # --- Original DTOs ---
    InternalAnalysis:
      type: object
      required: [id, compositionId, createDate, description, rating, color, problematicComponent, safeComponent]
      properties:
        id:
          type: string
          example: "analysis_123"
        compositionId:
          type: string
          example: "composition_123"
        createDate:
          type: string
          format: date-time
        description:
          type: string
        rating:
          type: number
          format: double
          minimum: 1.0
          maximum: 5.0
        color:
          $ref: '#/components/schemas/InternalColor'
        components:
          type: array
          items:
            $ref: '#/components/schemas/InternalComponent'

    InternalComposition:
      type: object
      required: [id, createDate, createDate, text]
      properties:
        id:
          type: string
          example: "composition_123"
        createDate:
          type: string
          format: date-time
        text:
          type: string
          minLength: 10
          maxLength: 5000

    InternalComponent:
      type: object
      properties:
        name:
          type: string
        scientificName:
          type: string
        description:
          type: string
        sources:
          type: string
        riskLevel:
          $ref: '#/components/schemas/InternalRiskLevel'
        healthRisks:
          type: string

    InternalRiskLevel:
      type: string
      enum: [MINIMAL, LOW, MEDIUM, HIGH, CRITICAL]

    InternalState:
      type: string
      enum: [NONE, RUNNING, FAILING, FINISHING]

    InternalColor:
      type: string
      enum: [NONE,VERY_DARK_RED,DARK_RED,DEEP_RED,RED,LIGHT_RED,RED_ORANGE,ORANGE,LIGHT_ORANGE,DARK_YELLOW,YELLOW,LIGHT_YELLOW,YELLOW_GREEN,PALE_GREEN,LIGHT_GREEN,GREEN,MEDIUM_GREEN,BRIGHT_GREEN,VIBRANT_GREEN,FRESH_GREEN,BRILLIANT_GREEN]