[versions]
kotlin = "2.2.10"
kotlinx-datetime = "0.6.2"
binary-compatibility-validator = "0.13.2"
jvm-compiler = "21"
jvm-language = "21"
spring-boot = "3.5.6"
spring-dependency-management = "1.1.7"
jib = "3.4.5"
jreImage = "21-latest"
kotlinx-serialization = "1.8.1"
openapi-generator = "7.15.0"
jackson = "2.20.1"

# Тестовые зависимости
junit = "5.14.0"
platform-launcher = "1.14.1"
testcontainers = "1.19.7"
okhttp = "5.3.2"
slf4j = "2.0.17"
assertj = "3.27.6"
assertk = "0.28.1"
fluentd-logger = "0.3.4"
logback = "1.4.14"
logstash-logback-encoder = "7.4"
logback-json-classic = "0.1.5"
logback-jackson = "0.1.5"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
lkotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
lvalidator = { module =  "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "binary-compatibility-validator"}
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Spring Boot
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }

# Сериализация
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Jackson
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-datatype = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

# Junit 5
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "platform-launcher" }

# Testcontainers
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

# HTTP CLIENT
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# Логирование
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
fluent-logger = { module = "org.fluentd:fluent-logger", version.ref = "fluentd-logger" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
logback-json-classic = { module = "ch.qos.logback.contrib:logback-json-classic", version.ref = "logback-json-classic" }
logback-jackson = { module = "ch.qos.logback.contrib:logback-jackson", version.ref = "logback-jackson" }

# ASSERTION LIBRARIES
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }

[bundles]


testcontainers = [
    "testcontainers-core",
    "testcontainers-junit"
]

fluent-logging = [
    "fluent-logger",
    "logstash-logback-encoder",
    "logback-classic",
    "logback-json-classic",
    "logback-jackson"
]